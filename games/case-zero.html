<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Zero — OSINT Investigation</title>
  <meta name="description" content="Case Zero — a free OSINT investigation game by Yehor Selin. You don't play at OSINT. You investigate.">
  <meta name="robots" content="noindex">
  <!-- Fonts self-hosted under site/games/fonts/ — see workstation.css @font-face block (S5.5.3). -->
  <link rel="stylesheet" href="ui/workstation.css">
</head>
<body>
  <div class="game-root">

    <!-- LANG SWITCHER (shared, fixed) -->
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en" class="lang-switch__btn" aria-pressed="true">EN</button>
      <span class="lang-switch__sep">·</span>
      <button type="button" data-lang="uk" class="lang-switch__btn">UA</button>
    </div>

    <!-- WELCOME -->
    <section class="welcome">
      <div class="welcome__sheet">
        <div class="welcome__eyebrow" data-i18n="welcome.eyebrow"></div>
        <h1 class="welcome__title" data-i18n="welcome.title"></h1>
        <p class="welcome__sub" data-i18n="welcome.sub" data-i18n-html></p>
        <button class="welcome__cta" data-action="play"></button>
        <div class="welcome__resume"></div>
      </div>
      <div class="welcome__watermark" aria-hidden="true"></div>
    </section>

    <!-- WORKSTATION -->
    <section class="workstation">
      <header class="ws-topbar">
        <div class="ws-topbar__title">
          <span data-i18n="topbar.case_prefix"></span><b data-i18n="topbar.case_title"></b>
        </div>
        <div class="ws-topbar__breadcrumb" aria-live="polite"></div>
        <div class="ws-topbar__right">
          <div class="ws-topbar__timer" aria-live="off"></div>
          <div class="ws-topbar__meta"></div>
        </div>
      </header>

      <div class="ws-body">
        <aside class="ws-sidebar">
          <div class="ws-sidebar__group">
            <div class="ws-sidebar__label" data-i18n="sidebar.group.sources"></div>
            <div data-sidebar-group="sources"></div>
          </div>
          <div class="ws-sidebar__group">
            <div class="ws-sidebar__label" data-i18n="sidebar.group.case"></div>
            <div data-sidebar-group="case"></div>
          </div>
        </aside>

        <main class="ws-main">
          <div class="pane" data-pane="frame"></div>
          <div class="pane" data-pane="trace"></div>
          <div class="pane" data-pane="chat"></div>
          <div class="pane" data-pane="atlas"></div>
          <div class="pane" data-pane="archive"></div>
          <div class="pane" data-pane="evidence"></div>
          <div class="pane" data-pane="report"></div>
          <div class="pane" data-pane="analyst"></div>
          <div class="pane" data-pane="notes"></div>
        </main>
      </div>
    </section>

    <div class="notif-stack" role="status" aria-live="polite"></div>
    <div class="reset-hint">
      <button data-action="reset" data-i18n="reset.button"></button>
    </div>
  </div>

  <script type="module" src="ui/workstation.js"></script>
</body>
</html>
